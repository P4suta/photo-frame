name: security

# Run the optional HEIF feature checks on request.
# The ordinary CI lint gate runs all four dependency checks.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  heif-build:
    name: heif feature compile + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build photo-frame-dev image
        run: HOST_UID=1000 HOST_GID=1000 docker compose build dev

      - name: cargo build --features heif
        run: |
          docker compose run --rm --no-deps dev \
            cargo build -p photo-frame-decode --features heif

      - name: cargo nextest --features heif
        run: |
          docker compose run --rm --no-deps dev \
            cargo nextest run -p photo-frame-decode --features heif --all-targets
